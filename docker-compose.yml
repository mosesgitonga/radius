# Local development stack.
#
#   cp .env.example .env
#   docker compose up --build
#
# This file is for development, not production: the API runs with auto-reload
# over a bind mount, and PostgreSQL and Redis publish ports to the host so that
# `uv run pytest` and `psql` work from outside the containers. Production
# deployment notes land in Phase 8.

name: myradius

# Every service restarts unless explicitly stopped. This is not just dev
# convenience: arq exits when it loses Redis, and without a restart policy the
# worker stays dead after a Redis bounce while the API carries on looking
# healthy. From Phase 1 the worker owns the cell_activity refresh the radius
# engine reads, so a silently dead worker means every radius quietly goes stale.
# Phase 8 adds alerting on arq's health-check key so this is noticed, not just
# recovered from.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file: .env
    environment:
      # Collation and encoding are fixed here rather than inherited from the
      # host locale, so indexes and text ordering behave identically everywhere.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory: creates the database the test
      # suite uses, so a fresh clone can run tests without manual setup.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only persistence: OTP codes and rate-limit counters surviving a
    # restart is worth the small write cost, and it matches production.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    # S3-compatible object storage for development, so the presigned-upload flow
    # is exercised for real rather than only in production. SeaweedFS rather than
    # MinIO: MinIO stopped publishing community images to Docker Hub in 2025, and
    # this is Apache-licensed and speaks S3 with SigV4 presigning. Production uses
    # Cloudflare R2; the application code is identical either way.
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: >-
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=256 -volume.max=0
    ports:
      - "8333:8333"
    volumes:
      - storage-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first,
      # and SeaweedFS does not listen on IPv6, so the probe would always fail.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      target: dev
    restart: unless-stopped
    command: ["bash", "docker/entrypoint.sh", "api-dev"]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Source is mounted so edits reload without a rebuild. The anonymous volume
      # keeps the host's .venv (built for Windows here) from shadowing anything.
      - .:/srv/app
      - /srv/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  worker:
    build:
      context: .
      target: dev
    restart: unless-stopped
    command: ["bash", "docker/entrypoint.sh", "worker"]
    env_file: .env
    volumes:
      - .:/srv/app
      - /srv/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      # Waits for the API container to have applied migrations before starting.
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  storage-data:
