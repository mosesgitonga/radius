; Alembic configuration.
;
; Note what is NOT here: sqlalchemy.url. The database URL is read from
; application settings in migrations/env.py, so there is one source of truth and
; no credentials in a committed file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

; Revision IDs are assigned by hand as 0001, 0002, ... (`alembic revision
; --rev-id 0002 -m "..."`). With this template the files then sort in apply order
; in any directory listing, which beats a hash nobody can order by eye.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
; Generated migrations go through the same formatter and linter as everything else.
hooks = ruff_format,ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

; ---------------------------------------------------------------------------
; Logging, used only when migrations run from the CLI.
; ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
