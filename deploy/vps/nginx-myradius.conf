# nginx site for MyRadius on the shared VPS: /etc/nginx/sites-available/myradius.chatara.co
#
# Installed by deploy/vps/bootstrap.sh. certbot (`certbot --nginx -d myradius.chatara.co`)
# then adds the TLS lines and the HTTP-to-HTTPS redirect to this file on the server.
#
#   /                   the API (127.0.0.1:8031), including the /v1/ws WebSocket
#   /myradius-media/    object storage (127.0.0.1:8032), for presigned uploads and
#                       downloads. The Host header is passed through unchanged:
#                       it is part of each URL's signature.

map $http_upgrade $myradius_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name myradius.chatara.co;

    # The API accepts small JSON bodies only; photos go to storage below.
    client_max_body_size 1m;

    # Scraped on the internal network only, never through the front door.
    location = /metrics {
        return 404;
    }

    location /myradius-media/ {
        # Photos: the API's own limit is lower; this only has to let them through.
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the API takes the leftmost entry as the client,
        # so nothing a client sends may survive in front of it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $myradius_connection_upgrade;
        proxy_read_timeout 120s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    # No access log: the API logs each request itself, redacted, without the
    # query string. nginx's default would keep tokens and presigned signatures.
    access_log off;
}
