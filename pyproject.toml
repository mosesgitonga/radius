[project]
name = "myradius"
version = "0.1.0"
description = "MyRadius — hyperlocal community backend for Kenya"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Production process manager. POSIX-only (it imports fcntl), so it is
    # installed in the Linux container but skipped on a Windows dev machine,
    # which runs uvicorn directly anyway.
    "gunicorn>=23.0; sys_platform != 'win32'",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "geoalchemy2>=0.16",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "arq>=0.26",
    # Gunicorn worker class for ASGI. Split out of uvicorn itself, which
    # removed uvicorn.workers in 0.54.
    "uvicorn-worker>=0.3; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "C4",    # comprehensions
    "DTZ",   # timezone-aware datetimes; we store UTC everywhere
    "T20",   # no print(); use the logger so redaction applies
    "SIM",   # simplify
    "RUF",
    "ASYNC",
    "S",     # bandit
]
ignore = [
    "B008",  # Depends() in argument defaults is FastAPI's documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Asserts and dummy credentials are the point in tests.
"tests/*" = ["S101", "S105", "S106", "S311"]
"migrations/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "arq.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/settings.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
