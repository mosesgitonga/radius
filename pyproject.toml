[project]
name = "myradius"
version = "0.1.0"
description = "MyRadius — hyperlocal community backend for Kenya"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Production process manager. POSIX-only (it imports fcntl), so it is
    # installed in the Linux container but skipped on a Windows dev machine,
    # which runs uvicorn directly anyway.
    "gunicorn>=23.0; sys_platform != 'win32'",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "geoalchemy2>=0.16",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "arq>=0.26",
    # Gunicorn worker class for ASGI. Split out of uvicorn itself, which
    # removed uvicorn.workers in 0.54.
    "uvicorn-worker>=0.3; sys_platform != 'win32'",
    # H3 hexagonal indexing: every location is stored as a cell, never as a
    # coordinate, and the radius engine walks H3 rings.
    "h3>=4.1",
    # E.164 normalisation and validation of Kenyan mobile numbers.
    "phonenumbers>=8.13",
    "pyjwt>=2.9",
    # Used by the Africa's Talking SMS provider, which calls their REST API
    # directly rather than pulling in their synchronous SDK. Also the test client.
    "httpx>=0.28",
    # Image processing: EXIF stripping and WebP variants.
    "pillow>=11.0",
    # S3-compatible storage. Synchronous, which is fine here: presigning is a
    # local HMAC computation, and the worker transfers objects in a thread.
    "boto3>=1.35",
    "firebase-admin>=6.5",
    "tzdata>=2026.5",
    "sentry-sdk>=2.72.0",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "C4",    # comprehensions
    "DTZ",   # timezone-aware datetimes; we store UTC everywhere
    "T20",   # no print(); use the logger so redaction applies
    "SIM",   # simplify
    "RUF",
    "ASYNC",
    "S",     # bandit
]
ignore = [
    "B008",  # Depends() in argument defaults is FastAPI's documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Asserts and dummy credentials are the point in tests.
"tests/*" = ["S101", "S105", "S106", "S311"]
"migrations/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# h3-py ships no py.typed marker, so its return types arrive as Any. The
# location module wraps every call in an explicit int()/float() for that reason.
module = ["geoalchemy2.*", "arq.*", "h3.*", "boto3.*", "botocore.*", "firebase_admin.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Fixtures and tests must share one event loop. The session-scoped engine and
# its pooled asyncpg connections belong to the loop that created them, and
# asyncpg raises "attached to a different loop" if a test touches them from
# another. Both scopes are set, because setting only the fixture one leaves
# tests on a per-function loop and every database test fails.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/settings.py"]
# SQLAlchemy's async layer runs ORM work in greenlets. Without this, coverage loses
# track across those switches and reports exercised code as missed.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
